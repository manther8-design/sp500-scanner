[project]
name = "sp500-scanner"
version = "0.1.0"
description = "Professional stock analysis and monitoring platform — Phase 1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "yfinance>=0.2.48",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "apscheduler>=3.10.4",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1.5",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
